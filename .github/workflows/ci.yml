name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @truerep/backend exec prisma generate
      - run: pnpm -r type-check
      - run: pnpm --filter @truerep/backend test
      # El build se verifica en CI a propósito: type-check no lo cubre. Next
      # importa cada ruta para recolectar metadatos, así que un cliente de SDK
      # construido al cargar el módulo rompe aquí y no en type-check (nos pasó
      # con Stripe y OpenAI). Sin secretos: si el build los necesita, está mal.
      - run: pnpm --filter @truerep/backend build
